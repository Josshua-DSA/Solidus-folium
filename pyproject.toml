[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "folium-terminal"
version = "7.0.0"
description = "Folium Terminal — Bloomberg-style Quantitative & Execution Platform for Indonesian Stocks (IDX)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Folium Quantitative Team"},
]

dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "yfinance>=0.2",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "typer>=0.9",
    "rich>=13.0",
    "pyyaml>=6.0",
    "questionary>=2.1",
    "prompt_toolkit>=3.0.36",
    "requests>=2.31",
    "polars>=1.0.0",
    "mlflow>=2.10.0",
    "dvc>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
]

[project.scripts]
folium = "shared.cli_entrypoint:main"
quant = "shared.cli_entrypoint:main"

[tool.setuptools]
py-modules = ["cli", "main"]

[tool.setuptools.packages.find]
include = [
    "pipeline*",
    "shared*",
    "model*",
    "app*",
    "frontend*",
]
exclude = ["tests*", "notebooks*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
