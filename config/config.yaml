# =============================================================================
# QUANT TRADING IDX v7 — Configuration
# =============================================================================

# ---------------------------------------------------------------------------
# Data Layer
# ---------------------------------------------------------------------------
data:
  start_date: "2015-01-01"
  end_date: "2025-12-31"
  cache_days: 7
  db_path: "data/ihsg_trading.db"

# ---------------------------------------------------------------------------
# Universe & Blacklist
# ---------------------------------------------------------------------------
universe:
  name: "lq45"           # idx_all | lq45 | kompas100 | custom
  custom_tickers: []     # Hanya dipakai jika name=custom

blacklist:
  min_price: 200         # Harga minimum (filter saham gocap)
  min_avg_volume: 1000000
  manual_blacklist: []

# ---------------------------------------------------------------------------
# Feature Engineering
# ---------------------------------------------------------------------------
features:
  momentum_window: 20
  volatility_window: 20
  tbl_window_size: 100
  tbl_barrier_pct: 0.03
  tbl_horizon: 5

# ---------------------------------------------------------------------------
# Model (Alpha Model — Fase 3)
# ---------------------------------------------------------------------------
model:
  type: "xgboost"        # xgboost | lightgbm
  n_estimators: 500
  learning_rate: 0.05
  max_depth: 6
  class_weight: "balanced"
  random_state: 42

# ---------------------------------------------------------------------------
# Portfolio Optimization
# ---------------------------------------------------------------------------
optimization:
  risk_aversion: 1.0
  transaction_cost_pct: 0.0015
  max_drawdown_penalty: 2.0
  turnover_penalty: 0.5
  min_weight: 0.0
  max_weight: 1.0

# ---------------------------------------------------------------------------
# Risk Management
# ---------------------------------------------------------------------------
risk:
  max_position_pct: 0.10
  max_sector_pct: 0.30
  max_drawdown_stop: -0.15
  daily_loss_limit: -0.03
  max_portfolio_var_95: -0.02

# ---------------------------------------------------------------------------
# Backtest
# ---------------------------------------------------------------------------
backtest:
  initial_capital: 100000000  # Rp100 juta
  commission_pct: 0.0015
  slippage_pct: 0.0005

# ---------------------------------------------------------------------------
# Walk-Forward Validation
# ---------------------------------------------------------------------------
walk_forward:
  n_splits: 5
  train_window: 504   # ~2 tahun
  test_window: 126    # ~6 bulan

# ---------------------------------------------------------------------------
# Execution
# ---------------------------------------------------------------------------
execution:
  lot_size: 100       # IDX constraint
  vwap_simulation: true

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging:
  level: "INFO"
  file: "outputs/logs/quant.log"
